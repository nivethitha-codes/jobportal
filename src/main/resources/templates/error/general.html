<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Error — JobSpark</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Loading Screen -->
<div th:replace="~{fragments/navbar :: loading}"></div>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div style="min-height:85vh; display:flex; align-items:center;
            justify-content:center; padding:2rem;">
  <div style="text-align:center; max-width:500px;">

    <!-- Animated Error Icon -->
    <div style="font-size:6rem; margin-bottom:1rem;
                animation:float 3s ease-in-out infinite;">
      ⚠️
    </div>

    <!-- Error Code -->
    <div style="font-size:5rem; font-weight:900; letter-spacing:-3px;
                background:linear-gradient(135deg,var(--primary),var(--secondary));
                -webkit-background-clip:text;
                -webkit-text-fill-color:transparent;
                background-clip:text; line-height:1;
                margin-bottom:1rem;">
      Oops!
    </div>

    <h2 style="font-size:1.5rem; font-weight:800;
               margin-bottom:0.75rem; color:var(--dark);">
      Something Went Wrong
    </h2>

    <p style="color:var(--text-muted); line-height:1.7;
              margin-bottom:2rem; font-size:0.95rem;"
       th:text="${errorMessage}">
      An unexpected error occurred. Please try again.
    </p>

    <!-- Action Buttons -->
    <div style="display:flex; gap:12px; justify-content:center;
                flex-wrap:wrap;">
      <a href="/" class="btn btn-primary btn-lg">
        🏠 Go Home
      </a>
      <a th:href="@{/jobs/browse}"
         class="btn btn-outline btn-lg">
        Browse Jobs
      </a>
      <button onclick="history.back()"
              class="btn btn-outline btn-lg">
        ← Go Back
      </button>
    </div>

    <!-- Help Text -->
    <p style="color:var(--text-muted); font-size:0.8rem; margin-top:2rem;">
      If this problem persists please contact support or try again later.
    </p>

  </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
